/* =====================================================================
   HANDLE DE REDIMENSIONNEMENT (A-1)
   ===================================================================== */
#panel-resize-handle {
  position: absolute;
  right: 0;
  top: 0;
  width: 6px;
  height: 100%;
  cursor: col-resize;
  z-index: 300;
  background: transparent;
  transition: background .15s;
}
#panel-resize-handle:hover { background: rgba(100,160,240,.15); }

@media (max-width: 480px) and (orientation: portrait) {
  #panel-resize-handle {
    bottom: 100%;
    top: auto;
    right: auto;
    left: 0;
    width: 100%;
    height: 12px;
    cursor: row-resize;
  }
}

/* =====================================================================
   SETTINGS — bouton ⚙ et drawer
   ===================================================================== */
#settings-btn {
  position: absolute;
  top: 16px;
  left: 16px;
  z-index: 600;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: #16213e;
  border: 1px solid #1a4a7a;
  color: #a0b4c8;
  font-size: 1.1em;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .15s, color .15s;
  box-shadow: 0 2px 8px rgba(0,0,0,.5);
}
#settings-btn:hover { background: #1a4a7a; color: #fff; }

#settings-drawer {
  position: absolute;
  top: 60px;
  left: 16px;
  z-index: 700;
  width: 240px;
  background: #16213e;
  border: 1px solid #1a4a7a;
  border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,.6);
  display: none;
  flex-direction: column;
  overflow: hidden;
  max-height: calc(100vh - 120px);
  overflow-y: auto;
}
#settings-drawer.open { display: flex; }

#settings-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  border-bottom: 1px solid #1a4a7a;
  background: #0f1628;
}
#settings-header span { font-size: .88em; font-weight: 600; color: #e0e0e0; }
#settings-close {
  background: none;
  border: none;
  color: #a0b4c8;
  cursor: pointer;
  font-size: .9em;
  padding: 2px 4px;
  border-radius: 4px;
  transition: background .15s;
}
#settings-close:hover { background: rgba(255,255,255,.1); color: #fff; }

#settings-body { padding: 6px 0; }

.settings-section {
  padding: 6px 12px 8px;
  border-bottom: 1px solid rgba(26,74,122,.5);
}
.settings-section:last-child { border-bottom: none; }

.settings-section-title {
  font-size: .72em;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: #4a7aaa;
  margin-bottom: 5px;
}
.settings-section label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: .82em;
  color: #a0b4c8;
  padding: 3px 0;

}
.settings-section label:hover { color: #e0e0e0; }

.settings-elev-btn {

  border-radius: 5px;

  font-size: .82em;

  text-align: left;

}

/* =====================================================================
   PANNEAU — structure principale (task 3.1)
   ===================================================================== */

/* --- Layout global --- */
/* Override body flex pour accueillir le panneau latéral */
#panel {
  width: 315px;
  min-width: 315px;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: #16213e;
  border-right: 1px solid #1a4a7a;
  flex-shrink: 0;
  position: relative;
  z-index: 200;
  transition: width .25s, min-width .25s;
}

/* Zone de rendu des vues — scrollable */
#panel-viewport {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
  position: relative;
  /* Scrollbar style */
  scrollbar-gutter: stable;
  scrollbar-width: thin;
  scrollbar-color: #1a4a7a #0f1628;
}
#panel-viewport::-webkit-scrollbar { width: 6px; }
#panel-viewport::-webkit-scrollbar-track { background: #0f1628; }
#panel-viewport::-webkit-scrollbar-thumb { background: #1a4a7a; border-radius: 3px; }

/* Vues créées dynamiquement par navigateTo() */
.panel-view {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  min-height: 100%;
  padding: 8px 12px 16px;
  box-sizing: border-box;
}

/* État compact du panneau */
#panel.compact {
  /* Sur desktop : on laisse la largeur mais le viewport se réduit au zéro */
}
#panel.compact #panel-viewport {
  display: none;
}

/* =====================================================================
   PANNEAU RESPONSIVE — portrait mobile (≤ 480px ET portrait)
   ===================================================================== */

@media (max-width: 480px) and (orientation: portrait) {
  /* Réorienter le body en colonne */
  body { flex-direction: column !important; }

  /* Le panneau passe en bottombar fixe */
  #panel {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100% !important;
    min-width: 0 !important;
    height: auto;
    border-right: none;
    border-top: 2px solid #1a4a7a;
    border-radius: 12px 12px 0 0;
    box-shadow: 0 -4px 24px rgba(0,0,0,.6);
    z-index: 2000;
  }

  /* État compact : juste la barre */
  #panel.compact {
    height: 48px;
    overflow: hidden;
  }
  #panel.compact #panel-viewport {
    display: none;
  }

  /* État expanded : 60vh */
  #panel.expanded {
    height: 60vh;
  }
  #panel.expanded #panel-viewport {
    display: block;
  }

  /* La carte occupe toute la hauteur — le panneau flotte par-dessus */
  #map-wrap { height: 100vh; }

  /* Masquer le sbtoggle desktop sur mobile — supprimé (tâche 5.1) */

  /* Profil altitude : ne pas afficher dans #elevpanel classique sur mobile
     (sera intégré dans panel-viewport en vague 3) */
  #elevpanel { height: 140px; }
  #elevcanvas { height: 116px; }
}

/* Tablette (481px–900px) en paysage : réduire la largeur */
@media (max-width: 900px) and (orientation: landscape) {
  #panel { width: 260px; min-width: 260px; }
}

/* =====================================================================
   RESPONSIVE — tablette & mobile
   ===================================================================== */

/* --- Mobile (≤ 768px) : ajustements profil altitude --- */

  /* ---- Profil altitude réduit ---- */
  #elevpanel{height:140px}

  #exag-pill{right:16px}
}

/* --- Très petit (≤ 380px) --- */

  /* (rien à ce stade) */
}

<script>
/* ========== NAV — état global et séquence plate ========== */
/* Design : Decision Point 1 — État objet centralisé + callbacks    */
/* Spec   : carte-responsive-nav / task 1.1                          */
var NAV = (function() {

  /* État interne — jamais muté directement de l'extérieur */
  var _state = {
    cahier:                   null,   // 1–4 | null
    chapitre:                 null,   // numéro de phase | null
    stopId:                   null,   // id du stop actif | null
    _previousStopId:          null,   // stopId conservé pendant la transition niveau 3→2 (F-2)
    _pendingHighlightChapitre: null,  // chapitre à mettre en surbrillance après next() depuis dernier item (D-2)
    _previousCahier:          null,   // cahier conservé pendant la transition niveau 1→0 (highlight retour accueil)
    _previousContext:         null,   // contexte complet avant go(3, cpaLoc) depuis carte (retour photo)
    cpaLoc:                   null,   // loc du lieu CPA actif (si pas de stopId) | null
    section:                  null,   // 'photos' | null — section de niveau 2
    level:                    0,      // 0–3
    panelExpanded:            true,
    panelMode:                'nav',  // 'nav' | 'elev'
    direction:                null    // 'forward' | 'back' | null — renseigné par go()
  };

  /* Listeners enregistrés par on('change', cb) */
  var _listeners = [];

  /* --- Utilitaire : copie superficielle de l'état --- */
  function _copy() {
    return {
      cahier:        _state.cahier,
      chapitre:      _state.chapitre,
      stopId:        _state.stopId,
      cpaLoc:        _state.cpaLoc,
      section:       _state.section,
      level:         _state.level,
      panelExpanded: _state.panelExpanded,
      panelMode:     _state.panelMode,
      direction:     _state.direction
    };
  }

  /* --- Émet l'événement 'change' à tous les abonnés --- */
  function _emit(event) {
    if (event !== 'change') return;
    var snapshot = _copy();
    for (var i = 0; i < _listeners.length; i++) {
      try { _listeners[i](snapshot); } catch(e) {}
    }
    /* NOTE: _previousStopId et _pendingHighlightChapitre sont intentionnellement
       conservés après l'émission — ils sont nettoyés au début du prochain go()
       pour que les fonctions de rendu appelées par les listeners puissent les lire. */
  }

  /* --- Abonnement --- */
  function on(event, cb) {
    if (event !== 'change') return;
    if (typeof cb !== 'function') return;
    _listeners.push(cb);
  }

  /* --- Désabonnement --- */
  function off(event, cb) {
    if (event !== 'change') return;
    for (var i = _listeners.length - 1; i >= 0; i--) {
      if (_listeners[i] === cb) { _listeners.splice(i, 1); return; }
    }
  }

  /* --- Navigation principale ---
   * level    : 0–3
   * ids      : objet optionnel { cahier, chapitre, stopId }
   * direction: 'forward' | 'back' (défaut : 'forward')
   * _fromSeq : usage interne — true quand appelé par next()/prev()
   */
  function go(level, ids, direction, _fromSeq) {
    /* Validation : aller au niveau 0 depuis le niveau 0 = no-op */
    if (level === 0 && _state.level === 0) return;

    /* Normalisation */
    level     = Math.max(0, Math.min(3, level));
    ids       = ids || {};
    direction = (direction === 'back') ? 'back' : 'forward';

    /* Nettoyer les marqueurs transitoires de la nav précédente (F-2, D-2) */
    _state._previousStopId           = null;
    _state._pendingHighlightChapitre = null;
    _state._previousCahier           = null;
    _state._previousContext          = null;

    var prevLevel = _state.level;

    /* Mise à jour de l'état selon le niveau cible */
    _state.level     = level;
    _state.direction = direction;

    if (level === 0) {
      /* Retour accueil : sauvegarder le cahier avant de le nullifier */
      _state._previousCahier = _state.cahier;
      _state.cahier   = null;
      _state.chapitre = null;
      _state.stopId   = null;
      _state.cpaLoc   = null;
      _state.section  = null;
    } else if (level === 1) {
      /* Niveau cahier : sauvegarder le chapitre avant de l'effacer (pour highlight au retour) */
      if (ids.cahier != null) _state.cahier = ids.cahier;
      _state._pendingHighlightChapitre = _state.chapitre;
      _state.chapitre = null;
      _state.stopId   = null;
      _state.cpaLoc   = null;
      _state.section  = null;
    } else if (level === 2) {
      /* Niveau chapitre / photos : stop effacé — conserver le stopId précédent (F-2) */
      if (ids.cahier   != null) _state.cahier   = ids.cahier;
      if (ids.chapitre != null) _state.chapitre = ids.chapitre;
      /* Sauvegarder le stopId avant de l'effacer (pour highlight au retour) */
      _state._previousStopId = _state.stopId;
      _state.stopId  = null;
      _state.cpaLoc  = null;
      _state.section = ids.section || null;
    } else if (level === 3) {
      /* Niveau étape / lieu-photo */
      if (ids.cahier   != null) _state.cahier   = ids.cahier;
      if (ids.chapitre != null) _state.chapitre = ids.chapitre;
      if (ids.stopId   != null) _state.stopId   = ids.stopId;
      /* Sauvegarder le contexte précédent si on arrive sur une CPA depuis la carte */
      if (ids.cpaLoc != null && _state.cpaLoc == null) {
        _state._previousContext = {
          level:    _state.level,
          cahier:   _state.cahier,
          chapitre: _state.chapitre,
          stopId:   _state.stopId,
          section:  _state.section
        };
      }
      /* Conserver cpaLoc si fourni (pour CPA sans stopId) */
      _state.cpaLoc = ids.cpaLoc || null;
      /* section : ne pas effacer (le lieu-photo est dans la section photos) */
    }

    /* Synchroniser _seqIndex si l'appel vient de l'extérieur */
    if (!_fromSeq) {
      _syncSeqIndex(_state.stopId, _state.cahier);
    }

    /* Raffiner la direction : back-level si on remonte dans la hiérarchie */
    if (direction === 'back' && _state.level < prevLevel) {
      _state.direction = 'back-level';
    }

    _emit('change');
  }

  /* --- Mode panneau : 'nav' | 'elev' --- */
  function setMode(mode) {
    if (mode !== 'nav' && mode !== 'elev') return;
    _state.panelMode = mode;
    _emit('change');
  }

  /* --- Toggle expanded/compact du panneau --- */
  function setExpanded(expanded) {
    var next = !!expanded;
    if (_state.panelExpanded === next) return; /* idempotent — pas d'émission si inchangé */
    _state.panelExpanded = next;
    _emit('change');
  }

  /* ------------------------------------------------------------------ */
  /* --- Séquence plate et navigation ◀/▶ (task 1.2) --------------- */
  /* ------------------------------------------------------------------ */

  /* Séquence plate — null jusqu'à initSequence() */
  var _seq      = null;
  var _seqIndex = -1;   // -1 = aucun item actif

  /* buildFlatSequence(cahiersData)
   * cahiersData : [CAHIER_1_DATA, CAHIER_2_DATA, CAHIER_3_DATA, CAHIER_4_DATA]
   * Retourne Array<{type:'stop'|'cpa', cahier:1-4, data:stopObj|lieuObj}>
   *
   * Algorithme par cahier :
   *   Pour chaque phase N dans l'ordre :
   *     a) Tous les stops dont stop.p === N (dans l'ordre du tableau)
   *     b) Lieux CPA dont lieu.stopId correspond à un stop de cette phase
   *        (groupés et ordonnés selon la position du stop de rattachement)
   *     c) Lieux CPA dont lieu.p === N et sans stopId
   *   Après toutes les phases :
   *     Lieux CPA sans p ni stopId
   */
  function buildFlatSequence(cahiersData) {
    var seq = [];

    for (var ci = 0; ci < cahiersData.length; ci++) {
      var cahierN = ci + 1;
      var data    = cahiersData[ci];
      if (!data) continue;

      var stops  = data.stops  || [];
      var lieux  = data.cpa    || data.lieux || [];
      var phases = data.PN     || {};

      /* Collecter les numéros de phases dans l'ordre d'apparition dans PN */
      var phaseNums = [];
      var seen = {};
      /* D'abord les phases définies dans PN */
      for (var pKey in phases) {
        if (phases.hasOwnProperty(pKey)) {
          var n = parseInt(pKey, 10);
          if (!seen[n]) { seen[n] = true; phaseNums.push(n); }
        }
      }
      /* Ajouter les phases présentes dans les stops mais absentes de PN */
      for (var si = 0; si < stops.length; si++) {
        var sp = stops[si].p;
        if (sp != null && !seen[sp]) { seen[sp] = true; phaseNums.push(sp); }
      }
      phaseNums.sort(function(a, b) { return a - b; });

      /* Index des lieux déjà placés */
      var placedLieux = {};

      for (var pi = 0; pi < phaseNums.length; pi++) {
        var phaseN = phaseNums[pi];

        /* a) Stops de cette phase dans l'ordre */
        var phaseStops = [];
        for (var si2 = 0; si2 < stops.length; si2++) {
          if (stops[si2].p === phaseN) phaseStops.push(stops[si2]);
        }
        for (var si3 = 0; si3 < phaseStops.length; si3++) {
          seq.push({ type: 'stop', cahier: cahierN, data: phaseStops[si3] });

          /* b) Lieux CPA rattachés à ce stop précis (stopId) */
          var stopId = phaseStops[si3].id;
          for (var li = 0; li < lieux.length; li++) {
            if (lieux[li].stopId === stopId && !placedLieux[li]) {
              seq.push({ type: 'cpa', cahier: cahierN, data: lieux[li] });
              placedLieux[li] = true;
            }
          }
        }

        /* c) Lieux CPA dont p === phaseN et sans stopId */
        for (var li2 = 0; li2 < lieux.length; li2++) {
          if (lieux[li2].p === phaseN &&
              (lieux[li2].stopId == null) &&
              !placedLieux[li2]) {
            seq.push({ type: 'cpa', cahier: cahierN, data: lieux[li2] });
            placedLieux[li2] = true;
          }
        }
      }

      /* Après toutes les phases : lieux sans p ni stopId */
      for (var li3 = 0; li3 < lieux.length; li3++) {
        if (!placedLieux[li3] &&
            (lieux[li3].p     == null) &&
            (lieux[li3].stopId == null)) {
          seq.push({ type: 'cpa', cahier: cahierN, data: lieux[li3] });
          placedLieux[li3] = true;
        }
      }
    }

    return seq;
  }

  /* --- Initialisation de la séquence (appelé après chargement des data) --- */
  function initSequence(cahiersData) {
    _seq      = buildFlatSequence(cahiersData);
    _seqIndex = -1;
  }

  /* --- Synchronise _seqIndex quand NAV.go() est appelé manuellement --- */
  function _syncSeqIndex(newStopId, newCahier) {
    if (!_seq) return;
    if (newStopId == null) { _seqIndex = -1; return; }
    for (var i = 0; i < _seq.length; i++) {
      var item = _seq[i];
      if (item.cahier === newCahier &&
          item.type === 'stop' &&
          item.data.id === newStopId) {
        _seqIndex = i;
        return;
      }
    }
    /* stopId non trouvé — laisser _seqIndex à -1 */
    _seqIndex = -1;
  }

  /* --- Construit les ids à passer à go() depuis un item de la séquence --- */
  function _itemToGoArgs(item) {
    if (item.type === 'stop') {
      var stop = item.data;
      return {
        level: 3,
        ids:   { cahier: item.cahier, chapitre: stop.p, stopId: stop.id }
      };
    } else {
      /* CPA : niveau 3, on utilise l'id du lieu (lat/lng identifier) —
         NAV.state.stopId portera null pour CPA pur ; on l'identifie
         via state.cahier + state.cpaLoc */
      var lieu = item.data;
      return {
        level: 3,
        ids:   { cahier: item.cahier, chapitre: lieu.p || null, stopId: null, cpaLoc: lieu.loc }
      };
    }
  }

  /* --- Navigation ▶ --- */
  function next() {
    if (!_seq || _seq.length === 0) return;
    var skipCpa = (_state.cpaLoc == null); /* sauter les CPA sauf si déjà sur une CPA */
    var idx = _seqIndex;
    /* Trouver le prochain item valide */
    var target = -1;
    for (var i = idx + 1; i < _seq.length; i++) {
      if (!skipCpa || _seq[i].type === 'stop') { target = i; break; }
    }
    if (target === -1) {
      /* Plus d'item valide — remonter au niveau 1 (cahier) avec highlight du chapitre */
      var lastItem = _seq[_seq.length - 1];
      if (lastItem) {
        _state._pendingHighlightChapitre = lastItem.type === 'stop'
          ? lastItem.data.p
          : (lastItem.data.p || null);
        go(1, { cahier: lastItem.cahier }, 'forward', true);
      }
      return;
    }
    _seqIndex = target;
    var args = _itemToGoArgs(_seq[_seqIndex]);
    go(args.level, args.ids, 'forward', true);
  }

  /* --- Navigation ◀ --- */
  function prev() {
    if (!_seq || _seq.length === 0) return;
    if (_seqIndex === -1) return;
    var skipCpa = (_state.cpaLoc == null);
    var idx = _seqIndex;
    /* Trouver le précédent item valide */
    var target = -1;
    for (var i = idx - 1; i >= 0; i--) {
      if (!skipCpa || _seq[i].type === 'stop') { target = i; break; }
    }
    if (target === -1) {
      /* Plus d'item valide — remonter au niveau 2 (chapitre) avec highlight */
      var firstItem = _seq[0];
      if (firstItem && firstItem.type === 'stop') {
        go(2, { cahier: firstItem.cahier, chapitre: firstItem.data.p }, 'back', true);
      }
      return;
    }
    _seqIndex = target;
    var args = _itemToGoArgs(_seq[_seqIndex]);
    go(args.level, args.ids, 'back', true);
  }

  /* --- Prédicats pour désactiver les boutons ◀/▶ --- */
  function isFirst() {
    return !_seq || _seq.length === 0 || _seqIndex <= 0;
  }

  function isLast() {
    return !_seq || _seq.length === 0 || _seqIndex >= _seq.length - 1;
  }

  /* Interface publique */
  return {
    /* Propriété en lecture seule — retourne une copie de l'état */
    get state() { return _copy(); },

    /* previousStopId — stopId conservé pendant la transition niveau 3→2 (F-2) */
    get previousStopId() { return _state._previousStopId; },

    /* previousCahier — cahier conservé pendant la transition niveau 1→0 */
    get previousCahier() { return _state._previousCahier; },

    /* previousContext — contexte complet avant go(3, cpaLoc) depuis carte */
    get previousContext() { return _state._previousContext; },

    /* pendingHighlightChapitre — chapitre à mettre en surbrillance (D-2) */
    get pendingHighlightChapitre() { return _state._pendingHighlightChapitre; },

    on:             on,
    off:            off,
    go:             go,
    setMode:        setMode,
    setExpanded:    setExpanded,
    next:           next,
    prev:           prev,
    initSequence:   initSequence,
    isFirst:        isFirst,
    isLast:         isLast,

    /* Exposé pour tests et débogage */
    _emit:               _emit,
    _syncSeqIndex:       _syncSeqIndex,
    _buildFlatSequence:  buildFlatSequence,
    get _seqIndex()      { return _seqIndex; },
    set _seqIndex(v)     { _seqIndex = v; },
    get _seq()           { return _seq; }
  };
})();

/* Design : Decision Point 3 — Module MapAdapter (seam carte)       */
/* Spec   : carte-responsive-nav / task 2.1                          */
var MapAdapter = (function() {

  /* stopId actuellement actif — null si aucun */
  var _activeStopId = null;

  /* --- Utilitaire : récupère les stops d'un cahier --- */
  function _getStops(cahierN) {
    var cd = (cahierN===1?CAHIER_1_DATA:cahierN===2?CAHIER_2_DATA:cahierN===3?CAHIER_3_DATA:CAHIER_4_DATA)||{};
    return cd.stops || [];
  }

  /* --- fitCahier(n) — fitBounds sur tous les stops du cahier, padding 60 --- */
  function fitCahier(n) {
    var stops = _getStops(n);
    if (!stops.length) return;
    var lngs = stops.map(function(s){return s.lng;});
    var lats = stops.map(function(s){return s.lat;});
    map.fitBounds(
      [[Math.min.apply(null,lngs), Math.min.apply(null,lats)],
       [Math.max.apply(null,lngs), Math.max.apply(null,lats)]],
      { padding:60, duration:mapTransitionDuration }
    );
  }

  /* --- fitChapitre(n, phaseN) — fitBounds sur les stops de la phase, padding 80 --- */
  function fitChapitre(n, phaseN) {
    var stops = _getStops(n).filter(function(s){ return s.p === phaseN; });
    if (!stops.length) { fitCahier(n); return; }
    var lngs = stops.map(function(s){return s.lng;});
    var lats = stops.map(function(s){return s.lat;});
    map.fitBounds(
      [[Math.min.apply(null,lngs), Math.min.apply(null,lats)],
       [Math.max.apply(null,lngs), Math.max.apply(null,lats)]],
      { padding:80, duration:mapTransitionDuration }
    );
  }

  /* --- flyToStop(stop) — zoom max(actuel, 13), durée mapTransitionDuration --- */
  function flyToStop(stop) {
    map.flyTo({
      center:   [stop.lng, stop.lat],
      zoom:     Math.max(map.getZoom(), 13),
      duration: mapTransitionDuration
    });
  }

  /* --- flyToCPA(lieu) — zoom max(actuel, 12) --- */
  function flyToCPA(lieu) {
    map.flyTo({
      center:   [lieu.lng, lieu.lat],
      zoom:     Math.max(map.getZoom(), 12),
      duration: 900
    });
  }

  /* --- setActiveMarker(stopId) — met à jour le visuel du marqueur actif ---
   * stopId = null → désactive le marqueur précédent uniquement
   * Utilise stopMarkerIndex pour retrouver l'élément DOM du marker.
   * L'élément inner (premier enfant de .mlk-pin) a transition:transform .15s.
   * État actif   = scale(1.35) translateY(-4px) + drop-shadow renforcé
   * État normal  = '' (reset)
   */
  function setActiveMarker(stopId) {
    /* Réinitialiser le précédent marqueur actif */
    if (_activeStopId != null && stopMarkerIndex[_activeStopId]) {
      var prev = stopMarkerIndex[_activeStopId].marker;
      var prevEl = prev.getElement();
      if (prevEl && prevEl.firstChild) {
        prevEl.firstChild.style.transform = '';
        prevEl.firstChild.style.filter    = 'drop-shadow(0 2px 4px rgba(0,0,0,0.55))';
      }
    }
    _activeStopId = stopId || null;
    /* Activer le nouveau marqueur */
    if (_activeStopId != null && stopMarkerIndex[_activeStopId]) {
      var curr = stopMarkerIndex[_activeStopId].marker;
      var currEl = curr.getElement();
      if (currEl && currEl.firstChild) {
        currEl.firstChild.style.transform = 'scale(1.35) translateY(-4px)';
        currEl.firstChild.style.filter    = 'drop-shadow(0 6px 14px rgba(0,0,0,0.75))';
      }
    }
  }

  /* --- showTracksOnly(n) — tracés visibles, marqueurs PIN masqués ---
   * Utilisé pour C2 et C3 au niveau 0 (FR-5.3)
   */
  function showTracksOnly(n) {
    /* Masquer les marqueurs PIN */
    if (htmlMarkers[n]) {
      htmlMarkers[n].forEach(function(m){ try { m.remove(); } catch(e){} });
    }
    /* Afficher les tracés */
    ['route-c'+n+'-solid', 'route-c'+n+'-dashed'].forEach(function(id) {
      if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', 'visible');
    });
  }

  /* --- showMarkersOnly(n) — marqueurs PIN visibles, tracés masqués ---
   * Utilisé pour C1 et C4 au niveau 0 (FR-5.3)
   */
  function showMarkersOnly(n) {
    /* Afficher les marqueurs PIN */
    if (htmlMarkers[n]) {
      htmlMarkers[n].forEach(function(m){ try { m.addTo(map); } catch(e){} });
    }
    /* Masquer les tracés */
    ['route-c'+n+'-solid', 'route-c'+n+'-dashed'].forEach(function(id) {
      if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', 'none');
    });
  }

  /* --- _fitAllLoaded() — fitBounds sur l'ensemble des cahiers chargés --- */
  function _fitAllLoaded() {
    if (!loadedCahiers || loadedCahiers.size === 0) return;
    var allLngs = [], allLats = [];
    loadedCahiers.forEach(function(n) {
      _getStops(n).forEach(function(s){ allLngs.push(s.lng); allLats.push(s.lat); });
    });
    if (!allLngs.length) return;
    map.fitBounds(
      [[Math.min.apply(null,allLngs), Math.min.apply(null,allLats)],
       [Math.max.apply(null,allLngs), Math.max.apply(null,allLats)]],
      { padding:60, duration:mapTransitionDuration }
    );
  }

  /* =====================================================================
   * showOverview() — efface tout, affiche summary markers + tracés couleur cahier
   * showCahier(n)  — efface tout, affiche marqueurs + tracés couleur phase de n
   * ===================================================================== */

  function showOverview() {
    /* 1. Retirer tous les marqueurs individuels et CPA de tous les cahiers */
    [1,2,3,4].forEach(function(n) {
      if (htmlMarkers[n]) htmlMarkers[n].forEach(function(m){ try{m.remove();}catch(e){} });
      if (cpaMarkers[n])  cpaMarkers[n].forEach(function(m){ try{m.remove();}catch(e){} });
    });
    /* 2. Tracés : visibles en couleur cahier pour C1/C2/C3, masqués pour C4 */
    [1,2,3,4].forEach(function(n) {
      var visible = loadedCahiers.has(n) && (n !== 4);
      var vis = visible ? 'visible' : 'none';
      var col = CAHIER_META[n].color;
      ['route-c'+n+'-solid','route-c'+n+'-dashed'].forEach(function(id) {
        if (!map.getLayer(id)) return;
        map.setLayoutProperty(id, 'visibility', vis);
        if (visible) map.setPaintProperty(id, 'line-color', col);
      });
    });
    /* 3. Summary markers */
    showSummaryMarkers(true);
    setActiveMarker(null);
    _fitAllLoaded();
  }

  function showCahier(n) {
    /* 1. Retirer summary markers */
    showSummaryMarkers(false);
    /* 2. Masquer tous les cahiers sauf n */
    [1,2,3,4].forEach(function(c) {
      if (c === n) return;
      if (htmlMarkers[c]) htmlMarkers[c].forEach(function(m){ try{m.remove();}catch(e){} });
      if (cpaMarkers[c])  cpaMarkers[c].forEach(function(m){ try{m.remove();}catch(e){} });
      ['route-c'+c+'-solid','route-c'+c+'-dashed'].forEach(function(id) {
        if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', 'none');
      });
    });
    /* 3. Afficher le cahier n en couleur phase */
    var solidId  = 'route-c'+n+'-solid';
    var dashedId = 'route-c'+n+'-dashed';
    if (map.getLayer(solidId)) {
      map.setPaintProperty(solidId, 'line-color', ['get','color']);
      map.setPaintProperty(solidId, 'line-width', 4);
      map.setPaintProperty(solidId, 'line-opacity', 0.85);
      map.setLayoutProperty(solidId, 'visibility', 'visible');
    }
    if (map.getLayer(dashedId)) {
      map.setPaintProperty(dashedId, 'line-color', ['get','color']);
      map.setLayoutProperty(dashedId, 'visibility', 'visible');
    }
    if (htmlMarkers[n]) htmlMarkers[n].forEach(function(m){ try{m.addTo(map);}catch(e){} });
    if (cpaGlobalVisible && cpaMarkers[n]) cpaMarkers[n].forEach(function(m){ try{m.addTo(map);}catch(e){} });
    /* Mettre à jour le profil altitude pour ce cahier */
    if (activeCahier !== n) renderElevation(n);
    activeCahier = n;
  }

  /* --- onNavChange(state) — aiguillage carte selon l'état NAV ---  */
  function onNavChange(state) {
    if (!map) return;
    var level = state.level;

    if (level === 0) {
      showOverview();

    } else if (level === 1) {
      if (state.cahier != null) {
        showCahier(state.cahier);
        fitCahier(state.cahier);
      }

    } else if (level === 2) {
      if (state.cahier != null) {
        showCahier(state.cahier);
        fitChapitre(state.cahier, state.chapitre);
      }

    } else if (level === 3) {
      if (state.cahier != null) showCahier(state.cahier);
      if (state.stopId != null) {
        var entry = stopMarkerIndex['c' + state.cahier + '_' + state.stopId];
        if (entry) flyToStop(entry.marker.getLngLat());
        setActiveMarker('c' + state.cahier + '_' + state.stopId);
      } else if (state.cpaLoc != null) {
        var cahierN = state.cahier;
        var cd = (cahierN===1?CAHIER_1_DATA:cahierN===2?CAHIER_2_DATA:cahierN===3?CAHIER_3_DATA:CAHIER_4_DATA)||{};
        var lieux = cd.cpa || cd.lieux || [];
        for (var i = 0; i < lieux.length; i++) {
          if (lieux[i].loc === state.cpaLoc) { flyToCPA(lieux[i]); break; }
        }
        setActiveMarker(null);
      }
    }
  }

  /* Interface publique */
  return {
    fitCahier:      fitCahier,
    fitChapitre:    fitChapitre,
    flyToStop:      flyToStop,
    flyToCPA:       flyToCPA,
    setActiveMarker:setActiveMarker,
    showTracksOnly: showTracksOnly,
    showMarkersOnly:showMarkersOnly,
    syncToState:    onNavChange,
    onNavChange:    onNavChange
  };
})();

function addCadastre() {
  if (map.getLayer('cadastre')) map.removeLayer('cadastre');

  if (!cadastreOn) return;
  map.addSource('cadastre-src', {
    type: 'raster',
    tiles: ['https://gis.stmk.gv.at/arcgis/rest/services/OGD/FranziszeischerKataster/MapServer/export'
      + '?dpi=96&transparent=true&format=png32&layers=show:2'
      + '&bbox={bbox-epsg-3857}&bboxSR=3857&imageSR=3857&size=256,256&f=image'],
    tileSize: 256,
    minzoom: 10, maxzoom: 18,
    attribution: '&copy; Land Steiermark — Cadastre franciscain (~1820-1860)'
  });
  map.addLayer({
    id: 'cadastre',
    type: 'raster',
    source: 'cadastre-src',
    paint: { 'raster-opacity': 0.75 }
  });
}

// =====================================================================
// getCahierData(n)
// =====================================================================
function getCahierData(n) {
  var meta = CAHIER_META[n];
  // Prefer external CAHIER_N_DATA if loaded, fall back to inline vars for large data (routes/elevProfile)
  var cd = (n===1?CAHIER_1_DATA : n===2?CAHIER_2_DATA : n===3?CAHIER_3_DATA : CAHIER_4_DATA) || {};
  // Routes: use CAHIER_N_DATA.staticRoutes if non-empty, else fall back to inline var
  var inlineRoutes = (n===1?(typeof staticRoutes_C1!=='undefined'?staticRoutes_C1:[])
                    : n===2?(typeof staticRoutes_C2!=='undefined'?staticRoutes_C2:[])
                    : n===3?(typeof staticRoutes_C3!=='undefined'?staticRoutes_C3:[])
                    : (typeof staticRoutes_C4!=='undefined'?staticRoutes_C4:[]));
  var inlineElev   = (n===1?(typeof elevProfile_C1!=='undefined'?elevProfile_C1:[])
                    : n===2?(typeof elevProfile_C2!=='undefined'?elevProfile_C2:[])
                    : n===3?(typeof elevProfile_C3!=='undefined'?elevProfile_C3:[])
                    : (typeof elevProfile_C4!=='undefined'?elevProfile_C4:[]));
  return {
    S:           (cd.stops)         || [],
    PC:          (cd.PC)            || {},
    PN:          (cd.PN)            || {},
    CPA:         (cd.cpa)           || [],
    routes:      (cd.staticRoutes && cd.staticRoutes.length > 0 ? cd.staticRoutes : inlineRoutes) || [],
    elevProfile: (cd.elevProfile && cd.elevProfile.length > 0   ? cd.elevProfile  : inlineElev)   || [],
    bbox:        meta.bbox,
    initialView: meta.initialView,
    noElevation: !!meta.noElevation,
    color:       meta.color,
    title:       meta.title,
    subtitle:    meta.subtitle,
    bounds:      cd.bounds || null,
    pins:        cd.pins   || {}
  };
}

function makeBadgeSVG(label) {
  var fs = label.length > 1 ? 10 : 13;
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">'
    +'<circle cx="12" cy="12" r="11" fill="white" opacity="0.93"/>'

    +' font-weight="bold" fill="#222" text-anchor="middle" dominant-baseline="central">'+label+'</text>'
    +'</svg>';
}

function makePinEl(color, iconSvg, small) {
  var w  = small ? 26 : 36;
  var h  = small ? 32 : 46;
  var cr = small ? 10 : 15;
  var cx = w / 2, cy = cr + 2, tipY = h - 2;
  var path = [
    'M',cx,tipY,
    'C',cx-cr*0.5,cy+cr, cx-cr-1,cy+cr*0.3, cx-cr-1,cy,
    'A',cr+1,cr+1,0,1,1, cx+cr+1,cy,
    'C',cx+cr+1,cy+cr*0.3, cx+cr*0.5,cy+cr, cx,tipY,'Z'
  ].join(' ');
  var iconSize = Math.round(cr*1.3);
  var iconX = cx - iconSize/2, iconY = cy - iconSize/2;
  var svgStr = '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" style="display:block">'
    +'<ellipse cx="'+cx+'" cy="'+(tipY+2)+'" rx="'+(cr*0.45)+'" ry="2.5" fill="rgba(0,0,0,0.3)"/>'
    +'<path d="'+path+'" fill="'+color+'" stroke="rgba(255,255,255,0.85)" stroke-width="1.5"/>'
    +'<path d="M '+(cx-cr*0.45)+','+(cy-cr*0.55)+' A '+(cr*0.65)+','+(cr*0.65)+' 0 0,1 '+(cx+cr*0.25)+','+(cy-cr*0.65)+'"'
    +' fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-linecap="round"/>'
    +'<svg x="'+iconX+'" y="'+iconY+'" width="'+iconSize+'" height="'+iconSize+'">'+iconSvg+'</svg>'
    +'</svg>';
  var el = document.createElement('div');
  el.className = 'mlk-pin';
  el.style.cssText = 'width:'+w+'px;height:'+h+'px;display:block;cursor:pointer;';
  var inner = document.createElement('div');
  inner.style.cssText = 'width:'+w+'px;height:'+h+'px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.55));'
    +'transition:transform .15s,filter .15s;transform-origin:bottom center;';
  inner.innerHTML = svgStr;
  el.appendChild(inner);
  el.addEventListener('mouseenter', function() {
    inner.style.transform = 'scale(1.2) translateY(-3px)';
    inner.style.filter = 'drop-shadow(0 5px 10px rgba(0,0,0,0.7))';
  });
  el.addEventListener('mouseleave', function() {
    inner.style.transform = '';
    inner.style.filter = 'drop-shadow(0 2px 4px rgba(0,0,0,0.55))';
  });
  return el;
}

function renderMarkersForCahier(n, data) {
  var stepN = 0;
  data.S.forEach(function(s) {
    var color  = data.PC[s.p] || CAHIER_META[n].color;
    var small  = false;
    stepN++;
    var iconSvg = makeBadgeSVG(String(stepN));
    var el = makePinEl(color, iconSvg, small);
    el.title = s.n;
    var pinH = 46;
    var marker = new maplibregl.Marker({ element:el, anchor:'bottom' })
      .setLngLat([s.lng, s.lat]);
    /* Les marqueurs naissent détachés — setActiveCahier les ajoute à la carte */
    (function(stop, ph, cahierN) {
      // Indexer le marker par stopId pour MapAdapter.setActiveMarker
      stopMarkerIndex['c' + cahierN + '_' + stop.id] = { marker:marker, cahier:cahierN };
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        /* FR-7 : plus de Popup — naviguer vers la vue-étape dans le Panneau */
        NAV.go(3, { cahier: cahierN, chapitre: stop.p, stopId: stop.id });
        Panel.setExpanded(true);
      });
    })(s, pinH, n);
    htmlMarkers[n].push(marker);
  });
}

    });
    wrap.addEventListener('mousemove', _summaryTooltipPosition);
    wrap.addEventListener('mouseleave', function() {
      el.style.transform = '';
      el.style.boxShadow = '0 1px 4px rgba(0,0,0,0.55)';
      _summaryTooltip.style.display = 'none';
    });
    wrap.addEventListener('click', function(e) {
      e.stopPropagation();

    var marker = new maplibregl.Marker({ element: wrap, anchor: 'center' })
      .setLngLat([pos.lng, pos.lat]);
    /* Naît détaché — showSummaryMarkers l'ajoute au niveau 0 */

  });
}

function showSummaryMarkers(visible) {
  [1,2,3,4].forEach(function(n) {
    summaryMarkers[n].forEach(function(m) {
      try { if (visible) { m.addTo(map); } else { m.remove(); } } catch(e){}
    });
  });
}

// =====================================================================
// renderLinesForCahier(n, data)
// =====================================================================
function renderLinesForCahier(n, data) {
  var solidId  = 'route-c'+n+'-solid';
  var dashedId = 'route-c'+n+'-dashed';
  if (map.getSource(solidId)) return; // déjà présent (re-add après style change géré séparément)

  var solidFeats = [], dashedFeats = [];
  data.routes.forEach(function(r) {
    var coords = r.coords.map(function(c) { return [c[1], c[0]]; });
    var feat = {
      type: 'Feature',
      geometry: { type:'LineString', coordinates:coords },
      properties: { p:r.p, color:data.PC[r.p] || CAHIER_META[n].color }
    };
    if (r.da === 1) dashedFeats.push(feat);
    else            solidFeats.push(feat);
  });

  var solidGJ  = { type:'FeatureCollection', features:solidFeats  };
  var dashedGJ = { type:'FeatureCollection', features:dashedFeats };

  map.addSource(solidId,  { type:'geojson', data:solidGJ  });
  map.addSource(dashedId, { type:'geojson', data:dashedGJ });

  /* Vue résumé (niveau 0) : couleur uniforme du cahier */
  var cahierColor = CAHIER_META[n].color;
  map.addLayer({
    id:solidId, type:'line', source:solidId,
    layout:{ 'line-join':'round','line-cap':'round' },
    paint:{ 'line-color':cahierColor, 'line-width':3.5, 'line-opacity':0.9 }
  });
  map.addLayer({
    id:dashedId, type:'line', source:dashedId,
    layout:{ 'line-join':'round','line-cap':'round' },
    paint:{ 'line-color':cahierColor, 'line-width':2.5, 'line-opacity':0.75, 'line-dasharray':[3,3] }
  });
}

    }

    // Registre global par clé cahier_stopIdx
    var regKey = 'c'+n+'_'+stopIdx;
    if (!window._CPA_REGISTRY) window._CPA_REGISTRY = {};
    window._CPA_REGISTRY[regKey] = stop.cpa;

    /* Clic sur le marqueur 📷 → naviguer vers la vue-lieu-photo (FR-3.5) */
    (function(s, cN) {

      .setLngLat([stop.lng,stop.lat]);
    /* Naît détaché — setCahierVisibility l'ajoute quand le cahier devient actif */
    cpaMarkers[n].push(m);
  });
}

var _cpaLbList = [], _cpaLbIdx = 0;

function cpaLbOpenItem(regKey, imgIdx) {
  if (!window._CPA_REGISTRY) return;

  _cpaLbRender();

function _cpaLbRender() {
  var it = _cpaLbList[_cpaLbIdx];
  if (!it) return;
  document.getElementById('cpa-lb-img').src   = it.img;
  document.getElementById('cpa-lb-title').textContent = it.title;
  document.getElementById('cpa-lb-desc').innerHTML    = it.desc;

  var next = document.getElementById('cpa-lb-next');
  if (_cpaLbList.length > 1) {
    prev.classList.toggle('hidden', _cpaLbIdx===0);

  }

  var lb = document.getElementById('cpa-lb');
  if (!lb.classList.contains('open')) return;
  if (e.key==='Escape')     lb.classList.remove('open');
  if (e.key==='ArrowRight') { _cpaLbIdx=Math.min(_cpaLbList.length-1,_cpaLbIdx+1); _cpaLbRender(); }

});

// =====================================================================
// fitAllLoaded() — Vue ensemble
// =====================================================================
function fitAllLoaded() {
  if (loadedCahiers.size < 2) return;
  var bboxes = Array.from(loadedCahiers).map(function(n){ return getCahierData(n).bbox; });
  var union  = bboxes.reduce(function(acc, bb) {
    return [
      [Math.min(acc[0][0],bb[0][0]), Math.min(acc[0][1],bb[0][1])],
      [Math.max(acc[1][0],bb[1][0]), Math.max(acc[1][1],bb[1][1])]
    ];
  });
  map.fitBounds(union, {padding:80, duration:1200});
}

  /* bouton supprimé du header — no-op */
}

// =====================================================================
// setCahierVisibility(n, visible) — affiche ou masque marqueurs + lignes d'un cahier
// =====================================================================
function setCahierVisibility(n, visible) {
  // Marqueurs stops
  htmlMarkers[n].forEach(function(m) {
    if (visible) { try { m.addTo(map); } catch(e){} }
    else         { try { m.remove();   } catch(e){} }
  });
  // Marqueurs CPA (si visibles globalement)
  if (cpaGlobalVisible) {
    cpaMarkers[n].forEach(function(m) {
      if (visible) { try { m.addTo(map); } catch(e){} }
      else         { try { m.remove();   } catch(e){} }
    });
  }
  // Lignes
  var vis = visible ? 'visible' : 'none';
  ['route-c'+n+'-solid', 'route-c'+n+'-dashed'].forEach(function(id) {
    if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', vis);
  });
}

// =====================================================================
// setActiveCahier(n)
// Maintient la compatibilité avec loadAllCahiers et loadCahier.
// Sans sidebar ni header, seules les fonctions essentielles restent.
// =====================================================================
function setActiveCahier(n, noFit, skipVisibility) {
  if (!skipVisibility) {
    // Repasser les tracés du cahier actif en couleur de phase
    var solidId  = 'route-c'+n+'-solid';
    var dashedId = 'route-c'+n+'-dashed';
    if (map.getLayer(solidId)) {
      map.setPaintProperty(solidId,  'line-color', ['get','color']);
      map.setPaintProperty(solidId,  'line-width', 4);
      map.setPaintProperty(solidId,  'line-opacity', 0.85);
    }
    if (map.getLayer(dashedId)) {
      map.setPaintProperty(dashedId, 'line-color', ['get','color']);
    }
    // Afficher marqueurs + tracés du cahier actif
    setCahierVisibility(n, true);
  }
  // Profil altitude
  renderElevation(n);
  // Hash URL
  updateHash(n);
  // État
  activeCahier = n;
}

// =====================================================================
// loadCahier(n) — fonction centrale
// =====================================================================
function loadCahier(n) {
  if (!map.loaded()) {
    map.once('load', function(){ loadCahier(n); });
    return;
  }
  if (loadedCahiers.has(n)) {
    setActiveCahier(n, true);
    return;
  }
  var data = getCahierData(n);
  renderLinesForCahier(n, data);
  renderMarkersForCahier(n, data);
  addCpaMarkersForCahier(n, data.CPA);
  loadedCahiers.add(n);
  updateVueEnsembleBtn();

  setActiveCahier(n, true);
}

function renderElevation(n) {

  ] : [];

  var WEATHER = n===3 ? {
    '9-20':{night:'clearNight'},'9-21':{day:'sun',night:'clearNight'},

    '10-3':{day:'sun',night:''},'10-4':{day:'sun',night:''},'10-5':{day:''}
  } : {};

  function weatherAt(dt, night) {
    if (!dt) return '';
    var w = WEATHER[(dt.getMonth()+1)+'-'+dt.getDate()];

  var SYNODIC = 29.530588853;
  function moonAge(dt) {
    var y=dt.getFullYear(),m=dt.getMonth()+1,d=dt.getDate(),h=dt.getHours()-2;
    if(m<=2){y-=1;m+=12;}
    var A=Math.floor(y/100),B=2-A+Math.floor(A/4);
    var jd=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+(h/24)+B-1524.5;
    var ref=2451550.259722;
    var age=(jd-ref)%SYNODIC;
    return age<0?age+SYNODIC:age;
  }
  function moonEmoji(age) {
    var f=age/SYNODIC;
    var icons=['\ud83c\udf11','\ud83c\udf12','\ud83c\udf13','\ud83c\udf14',
               '\ud83c\udf15','\ud83c\udf16','\ud83c\udf17','\ud83c\udf18'];
    return icons[Math.round(f*8)%8];
  }

  function sunTimes(year,month,day,lat,lng) {
    var tzOff=2;
    function dayOfYear(y,m,d){
      var N1=Math.floor(275*m/9),N2=Math.floor((m+9)/12);
      var N3=(1+Math.floor((y-4*Math.floor(y/4)+2)/3));
      return N1-(N2*N3)+d-30;
    }
    var N=dayOfYear(year,month,day);
    var rad=Math.PI/180,deg=180/Math.PI;
    var gamma=2*Math.PI/365*(N-1);
    var decl=0.006918-0.399912*Math.cos(gamma)+0.070257*Math.sin(gamma)
             -0.006758*Math.cos(2*gamma)+0.000907*Math.sin(2*gamma)
             -0.002697*Math.cos(3*gamma)+0.00148*Math.sin(3*gamma);
    var eqt=229.18*(0.000075+0.001868*Math.cos(gamma)-0.032077*Math.sin(gamma)
             -0.014615*Math.cos(2*gamma)-0.040849*Math.sin(2*gamma));
    var latr=lat*rad;
    var cosH=(Math.cos(90.833*rad)-Math.sin(latr)*Math.sin(decl))/(Math.cos(latr)*Math.cos(decl));
    if(cosH>1)return{sunrise:25,sunset:25};
    if(cosH<-1)return{sunrise:-1,sunset:25};
    var Ha=Math.acos(cosH)*deg;
    var solarNoon=720-4*lng-eqt+tzOff*60;
    return{sunrise:(solarNoon-4*Ha)/60,sunset:(solarNoon+4*Ha)/60};
  }

  function isNightAt(dt,lat,lng) {
    if(!dt)return false;
    var st=sunTimes(dt.getFullYear(),dt.getMonth()+1,dt.getDate(),lat,lng);
    var h=dt.getHours()+dt.getMinutes()/60;
    return h<st.sunrise||h>st.sunset;
  }

  function drawWeather(g,cx,cy,s,code) {
    if(!code)return;
    g.save();
    g.lineWidth=1.2;g.lineCap='round';g.lineJoin='round';
    var SUN='#e8c15a',CLOUD='#9fb0c8',RAIN='#7fa8d8',FOGC='#8a9ab0';
    function sun(x,y,r,col){
      g.strokeStyle=col;g.fillStyle=col;
      g.beginPath();g.arc(x,y,r,0,2*Math.PI);g.fill();
      for(var i=0;i<8;i++){var a=i*Math.PI/4;
        g.beginPath();g.moveTo(x+Math.cos(a)*(r+1.2),y+Math.sin(a)*(r+1.2));
        g.lineTo(x+Math.cos(a)*(r+s*0.5),y+Math.sin(a)*(r+s*0.5));g.stroke();}
    }

      g.fillStyle=col;g.beginPath();

      g.arc(x+s*0.55,y,s*0.36,0,2*Math.PI);g.rect(x-s*0.4,y,s*0.95,s*0.4);g.fill();
    }
    if(code==='sun'||code==='dry'){sun(cx,cy,s*0.5,SUN);}
    else if(code==='clearNight'){
      g.fillStyle='#cdd8ee';
      [[0,-s*0.2,1.1],[s*0.5,s*0.15,0.8],[-s*0.5,s*0.2,0.8]].forEach(function(p){
        g.beginPath();g.arc(cx+p[0],cy+p[1],p[2],0,2*Math.PI);g.fill();});

    }
    else if(code==='fogSun'){
      sun(cx-s*0.15,cy-s*0.15,s*0.38,SUN);
      g.strokeStyle=FOGC;
      for(var i=0;i<2;i++){var yy=cy+s*0.25+i*s*0.35;

    }
    else if(code==='storm'){
      cloud(cx,cy-s*0.15,CLOUD);g.strokeStyle=RAIN;
      for(var i=0;i<3;i++){var x0=cx-s*0.35+i*s*0.35;
        g.beginPath();g.moveTo(x0,cy+s*0.45);g.lineTo(x0-s*0.15,cy+s*0.85);g.stroke();}
    }

  function drawMoon(g,cx,cy,r,age) {
    var phase=age/SYNODIC,pa=2*Math.PI*phase,waxing=phase<0.5,k=Math.cos(pa);
    g.save();
    g.beginPath();g.arc(cx,cy,r,0,2*Math.PI);g.clip();
    g.fillStyle='#f5ecc4';g.beginPath();g.arc(cx,cy,r,0,2*Math.PI);g.fill();

  /* show(cahierData | cahierN) — charge et affiche le profil altitude
   * Accepte soit un entier (numéro de cahier) soit un objet data déjà
   * extrait par getCahierData().  Délègue à renderElevation() existant. */

    var alreadyVisible = _elevPanelVisible && _elevCurrentCahierN === cahierN;

    /* Charger (ou recharger) le profil pour ce cahier */
    renderElevation(cahierN);

    var elevPanel = document.getElementById('elevpanel');
    var elevToggle = document.getElementById('elevtoggle');

       (cahiers 1, 2, 4 = noElevation), on n'affiche rien */
    if (!_elevPts.length) {
      _currentCahierData = null;
      return;
    }

    _elevPanelVisible = true;
    elevPanel.classList.remove('hidden');
    if (elevToggle) {
      elevToggle.innerHTML = '\u25bc Profil altitude';
    }

    /* Forcer le redessin si le panneau vient de s'ouvrir */
    if (!alreadyVisible) {

/* --- renderCahier(cahierN) ---
 * Vue-cahier (niveau 1) :
 *   - Bouton ← → accueil (niveau 0)
 *   - Titre + période du cahier
 *   - Liste des chapitres (phases) avec numéro, titre, nb d'étapes
 *   - Section "Photos" avec nb de lieux-CPA
 * Référence : FR-3.2
 */
function renderCahier(cahierN) {
  var meta = CAHIER_META[cahierN] || {};
  var cd   = (cahierN===1?CAHIER_1_DATA:cahierN===2?CAHIER_2_DATA:cahierN===3?CAHIER_3_DATA:CAHIER_4_DATA) || {};
  var PC   = cd.PC    || {};
  var PN   = cd.PN    || {};
  var stops = cd.stops || [];
  var cpa   = cd.cpa   || [];

  /* Compter les stops par phase */
  var stopsPerPhase = {};
  stops.forEach(function(s) {
    if (s.p != null) {
      stopsPerPhase[s.p] = (stopsPerPhase[s.p] || 0) + 1;
    }
  });

  /* Phases triées dans l'ordre */
  var phaseNums = Object.keys(PN).map(Number).sort(function(a,b){return a-b;});
  /* Ajouter les phases présentes dans les stops mais absentes de PN */
  stops.forEach(function(s) {
    if (s.p != null && phaseNums.indexOf(s.p) === -1) phaseNums.push(s.p);
  });
  phaseNums.sort(function(a,b){return a-b;});

  /* FR-1.4 — État actif pour la surbrillance au retour */
  var navState       = NAV.state;
  /* D-2 : pendingHighlightChapitre si présent, sinon chapitre actif */
  var activePhase    = NAV.pendingHighlightChapitre || navState.chapitre;
  var activeSection  = navState.section;

  /* HTML — chapitres */
  var chapitresHTML = phaseNums.map(function(p, idx) {
    var color     = PC[p] || meta.color || '#888';
    var phaseName = PN[p] || ('Chapitre\u00a0' + (idx + 1));
    var nbStops   = stopsPerPhase[p] || 0;
    var metaStr   = nbStops + '\u00a0étape' + (nbStops > 1 ? 's' : '');
    /* Marquer le chapitre actif pour le scroll-to-active au retour (FR-1.4) */
    var isActive  = (activePhase === p && activeSection !== 'photos');
    return '<li class="pv-item' + (isActive ? ' active' : '') + '" style="border-left-color:' + color + '"'
      + ' onclick="NAV.go(2,{cahier:' + cahierN + ',chapitre:' + p + '})"'
      + ' title="Voir les étapes — ' + phaseName.replace(/"/g, '&quot;') + '">'
      + '<span class="pv-item-dot" style="background:' + color + '"></span>'
      + '<span class="pv-item-body">'
      + '<span class="pv-item-name">' + phaseName + '</span>'
      + '<span class="pv-item-meta">' + metaStr + '</span>'
      + '</span>'
      + '<span class="pv-item-arrow">&#9658;</span>'
      + '</li>';
  }).join('');

  /* HTML — section Photos */
  var nbLieux   = cpa.length;
  /* Marquer la section Photos active si on revient de la vue-photos (FR-1.4) */
  var photosActive = (activeSection === 'photos');
  var photosHTML = nbLieux > 0
    ? '<li class="pv-item pv-photos-item' + (photosActive ? ' active' : '') + '" style="margin-top:10px"'
      + ' onclick="NAV.go(2,{cahier:' + cahierN + ',section:\'photos\'})"'
      + ' title="Voir les photos anciennes">'
      + '<span class="pv-photos-icon">&#128247;</span>'
      + '<span class="pv-item-body">'
      + '<span class="pv-item-name">Photos</span>'
      + '<span class="pv-item-meta">' + nbLieux + '\u00a0lieu' + (nbLieux > 1 ? 'x' : '') + '</span>'
      + '</span>'
      + '<span class="pv-item-arrow">&#9658;</span>'
      + '</li>'
    : '';

  var prevCahier = cahierN > 1 ? cahierN - 1 : null;
  var nextCahier = cahierN < 4 ? cahierN + 1 : null;

  return _renderNavBar(
      'Cahier\u00a0' + cahierN + '\u00a0\u2014 ' + (meta.title || ''),
      'NAV.go(0,null,\'back\')',
      prevCahier ? 'NAV.go(1,{cahier:' + prevCahier + '},\'back\')' : null,
      nextCahier ? 'NAV.go(1,{cahier:' + nextCahier + '})' : null,
      !prevCahier, !nextCahier
    )
    + '<div class="pv-period">' + (meta.subtitle || '') + '</div>'
    + '<ul class="pv-list">'
    + chapitresHTML
    + photosHTML
    + '</ul>';
}

/* --- findStop(cahierData, stopId) ---
 * Retourne l'objet stop dont id === stopId, ou null.
 * Spec : carte-responsive-nav / task 3.4
 */
function findStop(cahierData, stopId) {
  var stops = (cahierData && (cahierData.S || cahierData.stops)) || [];
  for (var i = 0; i < stops.length; i++) {
    if (stops[i].id === stopId) return stops[i];
  }
  return null;
}

/* --- getStopSeqNum(cahierN, stopId) ---
 * Retourne le numéro séquentiel (1-based) d'un stop dans le cahier.
 * Même ordre que renderMarkersForCahier (parcours linéaire de data.S).
 */
function getStopSeqNum(cahierN, stopId) {
  var cd = (cahierN===1?CAHIER_1_DATA:cahierN===2?CAHIER_2_DATA:cahierN===3?CAHIER_3_DATA:CAHIER_4_DATA) || {};
  var stops = cd.stops || [];
  for (var i = 0; i < stops.length; i++) {
    if (stops[i].id === stopId) return i + 1;
  }
  return null;
}

/* --- renderChapitre(cahierN, phaseN) ---
 * Vue-chapitre (niveau 2) :
 *   - Bouton ← → vue-cahier (niveau 1)
 *   - Titre du chapitre avec couleur de phase
 *   - Liste des étapes : numéro séquentiel, nom, date
 *   - L'étape active (NAV.state.stopId) est mise en surbrillance
 * Référence : FR-3.3, FR-1.4
 */
function renderChapitre(cahierN, phaseN) {
  var cd   = (cahierN===1?CAHIER_1_DATA:cahierN===2?CAHIER_2_DATA:cahierN===3?CAHIER_3_DATA:CAHIER_4_DATA) || {};
  var PC   = cd.PC    || {};
  var PN   = cd.PN    || {};
  var stops = cd.stops || [];
  var color = PC[phaseN] || CAHIER_META[cahierN].color || '#888';
  var phaseName = PN[phaseN] || ('Chapitre\u00a0' + phaseN);

  /* Stops de cette phase dans l'ordre */
  var phaseStops = stops.filter(function(s) { return s.p === phaseN; });

  /* FR-1.4 — highlight au retour : utiliser previousStopId s'il est défini (F-2) */
  var activeStopId = (NAV.previousStopId !== null && NAV.previousStopId !== undefined)
    ? NAV.previousStopId : NAV.state.stopId;

  var itemsHTML = phaseStops.map(function(s) {
    var seqNum = getStopSeqNum(cahierN, s.id);
    var numStr = seqNum !== null ? String(seqNum) : '';
    /* eslint-disable eqeqeq */
    var isActive = activeStopId !== null && activeStopId !== undefined && s.id == activeStopId;
    return '<li class="pv-item' + (isActive ? ' active' : '') + '"'
      + ' style="border-left-color:' + color + '"'
      + ' onclick="NAV.go(3,{cahier:' + cahierN + ',chapitre:' + phaseN + ',stopId:' + s.id + '})">'
      + '<span class="pv-stop-num" style="color:' + color + '">' + numStr + '</span>'
      + '<span class="pv-item-body">'
      + '<span class="pv-item-name">' + s.n + '</span>'
      + (s.date ? '<div class="pv-stop-date">' + s.date + '</div>' : '')
      + '</span>'
      + '<span class="pv-item-arrow">&#9658;</span>'
      + '</li>';
  }).join('');

  /* D-3 — Boutons contextuels chapitre précédent/suivant */
  var allPhases = Object.keys(PN).map(Number).sort(function(a,b){return a-b;});
  stops.forEach(function(s) { if (s.p != null && allPhases.indexOf(s.p) === -1) allPhases.push(s.p); });
  allPhases.sort(function(a,b){return a-b;});
  var phaseIdx  = allPhases.indexOf(phaseN);
  var prevPhase = phaseIdx > 0 ? allPhases[phaseIdx - 1] : null;
  var nextPhase = phaseIdx < allPhases.length - 1 ? allPhases[phaseIdx + 1] : null;

  /* Si dernier chapitre, ▶ = premier chapitre du cahier suivant (sans passer par photos) */
  var prevFn, nextFn;
  if (prevPhase) {
    prevFn = 'NAV.go(2,{cahier:' + cahierN + ',chapitre:' + prevPhase + '},\'back\')';
  } else if (cahierN > 1) {
    /* Premier chapitre du cahier : ◀ = dernier chapitre du cahier précédent */
    var prevCd = (cahierN-1===1?CAHIER_1_DATA:cahierN-1===2?CAHIER_2_DATA:cahierN-1===3?CAHIER_3_DATA:CAHIER_4_DATA)||{};
    var prevAllPhases = Object.keys(prevCd.PN||{}).map(Number).sort(function(a,b){return a-b;});
    prevCd.stops && prevCd.stops.forEach(function(s){if(s.p!=null&&prevAllPhases.indexOf(s.p)===-1)prevAllPhases.push(s.p);});
    prevAllPhases.sort(function(a,b){return a-b;});
    var prevLastPhase = prevAllPhases[prevAllPhases.length-1];
    if (prevLastPhase != null) prevFn = 'NAV.go(2,{cahier:' + (cahierN-1) + ',chapitre:' + prevLastPhase + '},\'back\')';
  }
  if (nextPhase) {
    nextFn = 'NAV.go(2,{cahier:' + cahierN + ',chapitre:' + nextPhase + '})';
  } else if (cahierN < 4) {
    /* Dernier chapitre du cahier : ▶ = premier chapitre du cahier suivant */
    var nextCd = (cahierN+1===1?CAHIER_1_DATA:cahierN+1===2?CAHIER_2_DATA:cahierN+1===3?CAHIER_3_DATA:CAHIER_4_DATA)||{};
    var nextAllPhases = Object.keys(nextCd.PN||{}).map(Number).sort(function(a,b){return a-b;});
    nextCd.stops && nextCd.stops.forEach(function(s){if(s.p!=null&&nextAllPhases.indexOf(s.p)===-1)nextAllPhases.push(s.p);});
    nextAllPhases.sort(function(a,b){return a-b;});
    var nextFirstPhase = nextAllPhases[0];
    if (nextFirstPhase != null) nextFn = 'NAV.go(2,{cahier:' + (cahierN+1) + ',chapitre:' + nextFirstPhase + '})';
  }

  return _renderNavBar(
      phaseName,
      'NAV.go(1,{cahier:' + cahierN + '},\'back\')',
      prevFn || null, nextFn || null,
      !prevFn, !nextFn
    )
    + '<div class="pv-period">' + phaseStops.length + '\u00a0étape' + (phaseStops.length > 1 ? 's' : '') + '</div>'
    + '<ul class="pv-list">' + itemsHTML + '</ul>';
}

/* --- renderEtape(stop, PC, PN, cahierN) ---
 * Vue-étape (niveau 3) :
 *   - Bouton ← → vue-chapitre (niveau 2)
 *   - Nom complet de l'étape (h2)
 *   - Titre du chapitre avec couleur de phase
 *   - Date narrative
 *   - Description complète
 *   - Citation (blockquote si présente)
 *   - Référence/note historique (si présente)
 * Référence : FR-3.4, FR-1.4
 */
function renderEtape(stop, PC, PN, cahierN) {
  if (!stop) return '<div class="pv-period">Étape introuvable.</div>';
  var color     = PC[stop.p] || CAHIER_META[cahierN].color || '#888';
  var phaseName = PN[stop.p] || ('Chapitre\u00a0' + stop.p);

  var citationHTML = stop.q
    ? '<blockquote class="pv-etape-citation">\u00ab\u00a0' + stop.q + '\u00a0\u00bb</blockquote>'
    : '';

  var refHTML = stop.r
    ? '<aside class="pv-etape-ref">&#9432;\u00a0' + stop.r + '</aside>'
    : '';

  var descHTML = stop.d
    ? '<div class="pv-etape-desc">' + stop.d + '</div>'
    : '';

  var dateHTML = stop.date
    ? '<div class="pv-etape-date">&#128197;\u00a0' + stop.date + '</div>'
    : '';

  /* D-3 — Boutons contextuels ◀/▶ */
  var seqNum = getStopSeqNum(cahierN, stop.id);
  var cd = (cahierN===1?CAHIER_1_DATA:cahierN===2?CAHIER_2_DATA:cahierN===3?CAHIER_3_DATA:CAHIER_4_DATA) || {};
  var phaseStops = (cd.stops || []).filter(function(s){ return s.p === stop.p; });
  var isFirstInChapter = (seqNum === getStopSeqNum(cahierN, phaseStops[0] && phaseStops[0].id));
  var isLastInChapter  = (seqNum === getStopSeqNum(cahierN, phaseStops[phaseStops.length - 1] && phaseStops[phaseStops.length - 1].id));
  /* Utiliser _seqIndex global pour prev/next */
  var isFirstGlobal = NAV.isFirst();
  var isLastGlobal  = NAV.isLast();

  return _renderNavBar(
      stop.n,
      'NAV.go(2,{cahier:' + cahierN + ',chapitre:' + stop.p + '},\'back\')',
      'NAV.prev()', 'NAV.next()',
      isFirstGlobal, isLastGlobal
    )
    + '<div class="pv-etape-phase" style="color:' + color + '">' + phaseName + '</div>'
    + dateHTML
    + descHTML
    + citationHTML
    + refHTML;
}

/* --- renderPhotos(cahierN) — FR-3.5 (task 3.5) ---
 * Vue-photos (niveau 2, section='photos') :
 *   - Bouton ← → vue-cahier (niveau 1)

function renderPhotos(cahierN) {
  var meta = CAHIER_META[cahierN] || {};
  var cd   = (cahierN===1?CAHIER_1_DATA:cahierN===2?CAHIER_2_DATA:cahierN===3?CAHIER_3_DATA:CAHIER_4_DATA) || {};
  var lieux = cd.cpa || [];

  var lieux_html = lieux.map(function(lieu) {

    var firstImg  = (nbPhotos > 0) ? lieu.cpa[0].img : '';

    /* Échapper les guillemets dans loc pour usage inline onclick */

    return '<div class="pv-lieu-item"'

 * Retourne le HTML interne de la vue-lieu-photo pour l'index idx.
 * Utilisé à la fois par renderLieuPhoto et _updateLieuPhotoView.
 */
function _renderLieuPhotoContent(lieu, cahierN, idx) {
  var meta     = CAHIER_META[cahierN] || {};
  var cpaList  = lieu.cpa || [];
  var nbPhotos = cpaList.length;
  idx = Math.max(0, Math.min(nbPhotos - 1, idx || 0));
  var photo    = cpaList[idx] || {};

  /* Construire un objet sérialisable pour le onclick inline */
  /* On passe par un identifiant dans un registre temporaire plutôt que
     sérialiser le tableau complet en inline (problème d'échappement). */
  var regKey = '_lieu_' + cahierN + '_' + idx;
  if (!window._CPA_REGISTRY) window._CPA_REGISTRY = {};
  window._CPA_REGISTRY[regKey] = cpaList;

  var imgHTML = photo.img
    ? '<img class="pv-photo-img" src="' + photo.img + '" alt="'
        + (photo.title || '').replace(/"/g, '&quot;') + '"'
        + ' onclick="event.stopPropagation();_cpaLbOpenDirect(window._CPA_REGISTRY[\'' + regKey + '\'],' + idx + ')">'
    : '<div style="height:120px;background:#0a1020;display:flex;align-items:center;'
        + 'justify-content:center;color:#4a6a8a;font-size:2em;">&#128247;</div>';

  /* Boutons de navigation ◀/▶ internes */
  var prevDisabled = idx === 0 ? ' disabled' : '';
  var nextDisabled = idx === nbPhotos - 1 ? ' disabled' : '';

  /* Construire une représentation sérialisée de lieu pour les boutons nav */
  /* On passe par un registre global pour éviter l'échappement JSON inline */
  var lieuRegKey = '_lieu_nav_' + cahierN + '_' + lieu.loc.replace(/[^a-zA-Z0-9]/g, '_');
  window._LIEU_REGISTRY = window._LIEU_REGISTRY || {};

  var navHTML = nbPhotos > 1
    ? '<div class="pv-photo-nav">'

        + '&#9654;</button>'
        + '</div>'
    : '';

  /* Bouton retour : si on vient de la carte (previousContext), retourner au contexte précédent */
  var backFn;
  var ctx = NAV.previousContext;
  if (ctx) {
    if (ctx.level === 0) {
      backFn = 'NAV.go(0,null,\'back-level\')';
    } else if (ctx.level === 1) {
      backFn = 'NAV.go(1,{cahier:' + ctx.cahier + '},\'back-level\')';
    } else if (ctx.level === 2 && ctx.section === 'photos') {
      backFn = 'NAV.go(2,{cahier:' + ctx.cahier + ',section:\'photos\'},\'back-level\')';
    } else if (ctx.level === 2 && ctx.chapitre != null) {
      backFn = 'NAV.go(2,{cahier:' + ctx.cahier + ',chapitre:' + ctx.chapitre + '},\'back-level\')';
    } else if (ctx.level === 3 && ctx.stopId != null) {
      backFn = 'NAV.go(3,{cahier:' + ctx.cahier + ',chapitre:' + ctx.chapitre + ',stopId:' + ctx.stopId + '},\'back-level\')';
    } else {
      backFn = 'NAV.go(2,{cahier:' + cahierN + ',section:\'photos\'},\'back-level\')';
    }
  } else {
    backFn = 'NAV.go(2,{cahier:' + cahierN + ',section:\'photos\'},\'back-level\')';
  }

  return _renderNavBar(
      lieu.loc,

/* --- _getRenderFn(state) ---
 * Fonction pure qui détermine la renderFn et la direction à partir de l'état NAV.
 * Retourne {renderFn, direction} ou null si aucune vue n'est applicable.
 * Utilisé par le dispatcher et les tests.
 */
function _getRenderFn(state) {
  var dir = state.direction || 'forward';
  if (state.level === 0) {
    return { renderFn: renderAccueil, direction: dir };
  } else if (state.level === 1 && state.cahier != null && !state.section) {
    var cN = state.cahier;
    return { renderFn: function() { return renderCahier(cN); }, direction: dir };
  } else if (state.level === 2 && state.cahier != null && state.section === 'photos') {
    var cN2 = state.cahier;
    return { renderFn: function() { return renderPhotos(cN2); }, direction: dir };
  } else if (state.level === 2 && state.cahier != null && state.chapitre != null && !state.section) {
    var cN3 = state.cahier, pN = state.chapitre;
    return { renderFn: function() { return renderChapitre(cN3, pN); }, direction: dir };
  } else if (state.level === 3 && state.cpaLoc != null) {
    var cN4 = state.cahier, loc = state.cpaLoc;
    var lieu = findLieuByCpaLoc(cN4, loc);
    if (lieu) {
      return { renderFn: function() { return renderLieuPhoto(lieu, cN4, 0); }, direction: dir };
    }
  } else if (state.level === 3 && state.stopId != null) {
    var cN5 = state.cahier, sId = state.stopId;
    var cd = getCahierData(cN5);
    var stop = findStop(cd, sId);
    return { renderFn: function() { return renderEtape(stop, cd.PC || {}, cd.PN || {}, cN5); }, direction: dir };
  }
  return null;
}

/* --- Abonnement NAV → Views : dispatch vers les fonctions de rendu ---
 * Vagues 3+4 : niveaux 0–3 gérés (tâches 3.2, 3.3, 3.4, 3.5).
 */
NAV.on('change', function(state) {
  var dir = state.direction || 'forward';
  var info = _getRenderFn(state);
  if (!info) return;

  /* Effets de bord non-Panel : flyTo, expand */
  if (state.level === 3 && state.cpaLoc != null) {
    var lieuSide = findLieuByCpaLoc(state.cahier, state.cpaLoc);
    if (lieuSide) {
      MapAdapter.flyToCPA(lieuSide);
      Panel._expandDirect();
    }
    if (!info) return;
  } else if (state.level === 3 && state.stopId != null) {
    Panel._expandDirect();
  }

  Panel._queueNav(info, dir);
});

/* Design : § Détection swipe, requirements FR-2.1, FR-2.2            */
/* Spec   : carte-responsive-nav / task 4.1                            */

/* --- attachSwipe(el, onLeft, onRight, onUp, onDown) ---
 * Seuil : déplacement horizontal ≥ 50px ET ratio h/v ≥ 2 (FR-2.2).
 * Les callbacks absents sont ignorés silencieusement.
 */
function attachSwipe(el, onLeft, onRight, onUp, onDown) {
  var startX, startY;
  el.addEventListener('touchstart', function(e) {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });
  el.addEventListener('touchend', function(e) {
    var dx = e.changedTouches[0].clientX - startX;
    var dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) >= 50 && Math.abs(dx) / Math.abs(dy) >= 2) {
      /* Swipe horizontal */
      if (dx < 0 && onLeft)  onLeft();
      if (dx > 0 && onRight) onRight();
    } else if (Math.abs(dy) >= 50 && Math.abs(dy) / Math.abs(dx) >= 2) {
      /* Swipe vertical */
      if (dy < 0 && onUp)   onUp();
      if (dy > 0 && onDown) onDown();
    }
  }, { passive: true });
}

var Interactions = (function() {

  function init() {
    /* --- Swipe sur #panel-viewport (FR-2.2) ---
     * gauche → NAV.next(), droite → NAV.prev()
     * haut   → expand,    bas    → compact
     */
    var viewport = document.getElementById('panel-viewport');
    if (viewport) {
      attachSwipe(
        viewport,
        function() { NAV.next(); },              /* gauche */
        function() { NAV.prev(); },              /* droite */
        function() { Panel.setExpanded(true);  }, /* haut   */
        function() { Panel.setExpanded(false); }  /* bas    */
      );
    }

    /* --- Swipe sur #panel (FR-2.2) ---
     * haut → expand, bas → compact (swipe vertical sur tout le panneau)
     */
    var panel = document.getElementById('panel');
    if (panel) {
      attachSwipe(
        panel,
        null,
        null,
        function() { Panel.setExpanded(true);  },
        function() { Panel.setExpanded(false); }
      );
    }
  }

  return { init: init };
})();
/* ========== /Interactions ========== */

/* --- Abonnement NAV → ElevPanel ---
 * Synchronise le profil altitude avec l'état NAV :
 *   panelMode === 'elev'  → ElevPanel.show(cahier actif)
 *   autre mode            → ElevPanel.hide()
 *   stopId change         → ElevPanel.setHighlight(stopId)
 */
NAV.on('change', function(state) {
  if (state.panelMode === 'elev') {
    ElevPanel.show(state.cahier || 1);
  } else {
    /* Ne masquer que si le profil était visible — évite des map.resize() inutiles */
    /* Exception : si le profil est visible et qu'on navigue vers un stop du même cahier
       (clic depuis le profil ou la carte), garder le profil ouvert */
    var keepOpen = _elevPanelVisible
      && (state.level === 2 || state.level === 3)
      && state.cahier === _elevCurrentCahierN;
    if (_elevPanelVisible && !keepOpen) {
      ElevPanel.hide();
    }
  }
  /* Synchronisation highlight (FR-5.1 / FR-6.2) */
  ElevPanel.setHighlight(state.stopId);
});

  if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function(){});
  var toast = document.getElementById('dblclick-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'dblclick-toast';
    toast.style.cssText = 'position:fixed;bottom:50px;left:50%;transform:translateX(-50%);'
      +'background:rgba(15,52,96,.97);color:#f5a623;border:1px solid #1a4a7a;border-radius:6px;'
      +'padding:7px 16px;font-size:.88em;font-family:monospace;z-index:5000;pointer-events:none;'
      +'transition:opacity .4s;white-space:nowrap;';
    document.body.appendChild(toast);
  }
  toast.textContent = '📋 '+text;
  toast.style.opacity = '1';
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ toast.style.opacity='0'; },2200);
});

// SETTINGS DRAWER — ouverture/fermeture
// =====================================================================
(function() {
  var btn      = document.getElementById('settings-btn');
  var drawer   = document.getElementById('settings-drawer');
  var closeBtn = document.getElementById('settings-close');

  btn.addEventListener('click', function(e) {
    e.stopPropagation();
    drawer.classList.toggle('open');
  });
  closeBtn.addEventListener('click', function() {
    drawer.classList.remove('open');
  });
  /* Fermer en cliquant ailleurs */
  document.addEventListener('click', function(e) {
    if (!drawer.contains(e.target) && e.target !== btn) {
      drawer.classList.remove('open');
    }
  });

  /* E-1 — Durée des transitions MapLibre */
  var ckTransition = document.getElementById('ck-transition');
  if (ckTransition) {
    ckTransition.addEventListener('change', function() {
      mapTransitionDuration = parseInt(this.value, 10);
    });
  }

  /* E-2 — Terrain 3D checkbox */
  var ckTerrainEl = document.getElementById('ck-terrain');
  if (ckTerrainEl) {
    ckTerrainEl.addEventListener('change', function() {
      terrainOn = this.checked;
      applyTerrain();
      updateExagBtn();
      syncTerrainUI();
    });
  }
})();
// =====================================================================
// CHARGEMENT DE TOUS LES CAHIERS + VUE D'ENSEMBLE
// =====================================================================
function loadAllCahiers() {
  function doLoad() {
    // Charger les données de chaque cahier sans déclencher flyTo ni setActiveCahier
    var firstLoad = loadedCahiers.size === 0;
    [1, 2, 3, 4].forEach(function(n) {
      if (!loadedCahiers.has(n)) {
        var data = getCahierData(n);
        renderLinesForCahier(n, data);
        renderMarkersForCahier(n, data);
        renderSummaryMarkers(n, data);
        addCpaMarkersForCahier(n, data.CPA);
        loadedCahiers.add(n);
      }
    });
    // S'assurer que les 4 cahiers sont visibles pour la vue d'ensemble (géré par onNavChange)
    updateVueEnsembleBtn();
    // Activer C1 au premier chargement (profil altitude et hash URL uniquement — pas de visibilité)
    if (firstLoad) setActiveCahier(1, true, /*skipVisibility=*/true);
    // Afficher directement les marqueurs résumé
    showSummaryMarkers(true);
  }
  if (map.loaded()) { doLoad(); }
  else { map.once('load', doLoad); }
}

window.addEventListener('hashchange', function(){

// =====================================================================
// INITIALISATION AU CHARGEMENT
// =====================================================================
(function init() {
  updateExagBtn();
  // Initialiser la séquence plate ◀/▶ traversante (task 5.3 — FR-2.1)
  // Les 4 data files sont chargés synchroniquement via <script src>, donc
  // CAHIER_N_DATA sont disponibles immédiatement ici.
  NAV.initSequence([CAHIER_1_DATA, CAHIER_2_DATA, CAHIER_3_DATA, CAHIER_4_DATA]);
  // Brancher MapAdapter sur NAV
  NAV.on('change', function(state) { MapAdapter.onNavChange(state); });
  // Initialiser le Panneau (task 3.1) : breadcrumb click + NAV wiring
  Panel.init();
  // Initialiser les interactions ◀/▶ et swipe (task 4.1)
  Interactions.init();
  // Charger tous les cahiers sur la carte (marqueurs + tracés + CPA)
  loadAllCahiers();

  /* FR-3.1 / FR-8 — Afficher la vue-accueil au chargement, panneau expanded.
   * NAV.go(0) retourne no-op si déjà au niveau 0 (état initial),
   * donc on appelle navigateTo directement pour le rendu initial. */
  Panel.setExpanded(true);
  Panel.navigateTo(renderAccueil, 'forward');

  /* FR-1.4 / NFR-5 — Semer l'entrée initiale dans l'historique.
   * Sans cet appel, le premier popstate déclencherait une sortie de page. */
  history.pushState({ level: 0 }, '');
})();

// =====================================================================
// BOUTON RETOUR ANDROID — history.pushState + popstate (task 4.2)
// FR-1.4 : le bouton retour OS remonte d'un niveau dans NAV.
// NFR-5  : depuis le niveau 0, aucune sortie de page.
// =====================================================================

/* Pousser une entrée dans l'historique à chaque navigation forward > 0 */
NAV.on('change', function(state) {
  if (state.direction === 'forward' && state.level > 0) {
    history.pushState({ level: state.level }, '');
  }
});

/* Intercepter le bouton retour OS / Android */
window.addEventListener('popstate', function(e) {
  var targetLevel = Math.max(0, NAV.state.level - 1);
  if (NAV.state.level === 0) {
    /* Déjà au niveau 0 — ré-injecter une entrée pour empêcher la sortie */
    history.pushState({ level: 0 }, '');
    return;
  }
  NAV.go(targetLevel, null, 'back');
});

// =====================================================================
// CONTRÔLE D'EXAGÉRATION DU RELIEF — drag vertical sur btn-exag
// =====================================================================
// CONTRÔLE D'EXAGÉRATION — clic milieu + drag vertical sur la carte
// =====================================================================
(function() {
  var active    = false;
  var startY    = 0;
  var startExag = 1.0;
  var indicator = null; // label flottant pendant le drag

  var mapCanvas = document.getElementById('map');

  function showIndicator(y) {
    if (!indicator) {
      indicator = document.createElement('div');
      indicator.style.cssText =
        'position:fixed;z-index:9000;background:rgba(15,22,40,.92);color:#f5a623;'
        +'border:1px solid #1a4a7a;border-radius:5px;padding:4px 10px;font-size:.9em;'
        +'font-family:monospace;pointer-events:none;white-space:nowrap;'
        +'transform:translateX(-50%);';
      document.body.appendChild(indicator);
    }
    indicator.textContent = '\u26f0 \xd7' + terrainExaggeration.toFixed(1);
    indicator.style.left = (window.innerWidth / 2) + 'px';
    indicator.style.top  = Math.max(60, y - 30) + 'px';
    indicator.style.display = 'block';
  }

  function hideIndicator() {
    if (indicator) indicator.style.display = 'none';
  }

  // Bloquer le comportement natif du clic milieu (autoscroll Windows)
  // sur le canvas MapLibre ET sur toute la zone carte
  document.getElementById('map-wrap').addEventListener('mousedown', function(e) {
    if (e.button === 1) { e.preventDefault(); }
  });
  document.getElementById('map-wrap').addEventListener('auxclick', function(e) {
    e.preventDefault();
  });

  // Démarrer le drag sur clic milieu
  mapCanvas.addEventListener('mousedown', function(e) {
    if (e.button !== 1) return;       // uniquement bouton milieu
    if (!terrainOn) return;
    e.preventDefault();
    e.stopPropagation();
    active    = true;
    startY    = e.clientY;
    startExag = terrainExaggeration;
    document.body.style.cursor = 'ns-resize';
    showIndicator(e.clientY);
  });

  document.addEventListener('mousemove', function(e) {
    if (!active) return;
    var dy    = startY - e.clientY;   // haut = positif = augmenter
    var v = Math.min(5.0, Math.max(0.2, startExag + dy * 0.025));
    v = Math.round(v * 10) / 10;
    if (v !== terrainExaggeration) {
      terrainExaggeration = v;
      applyTerrain();
      updateExagBtn();
    }
    showIndicator(e.clientY);
  });

  document.addEventListener('mouseup', function(e) {
    if (!active) return;
    if (e.button !== 1) return;
    active = false;
    document.body.style.cursor = '';
    hideIndicator();
  });

  // Sécurité : relâchement si la fenêtre perd le focus
  window.addEventListener('blur', function() {
    if (active) {
      active = false;
      document.body.style.cursor = '';
      hideIndicator();
    }
  });

  // Double-clic sur exag-pill pour remettre l'exagération à ×1.0
  document.getElementById('exag-pill').addEventListener('dblclick', function() {
    terrainExaggeration = 1.0;
    applyTerrain();
    updateExagBtn();
  });
})();

// =====================================================================
// PANEL RESIZE — module de redimensionnement par drag (A-1)
// =====================================================================
var PanelResize = (function() {
  var _active    = false;
  var _startPos  = 0;    // clientX (desktop) ou clientY (mobile)
  var _startSize = 0;    // width (desktop) ou height (mobile) au début du drag
  var _mobile    = false;

  var MIN_WIDTH  = 220;
  var MIN_HEIGHT = 48;

  function _getPanel() { return document.getElementById('panel'); }
  function _getMap()   { return typeof map !== 'undefined' ? map : null; }

  function _clampDesktop(w) {
    return Math.min(Math.round(window.innerWidth * 0.5), Math.max(MIN_WIDTH, w));
  }
  function _clampMobile(h) {
    return Math.min(Math.round(window.innerHeight * 0.8), Math.max(MIN_HEIGHT, h));
  }

  function _onStart(e) {
    var handle = document.getElementById('panel-resize-handle');
    if (!handle) return;
    _mobile = window.matchMedia('(max-width:480px) and (orientation:portrait)').matches;
    var panel = _getPanel();
    if (!panel) return;
    _active    = true;
    if (_mobile) {
      _startPos  = (e.touches ? e.touches[0].clientY : e.clientY);
      _startSize = panel.offsetHeight;
    } else {
      _startPos  = (e.touches ? e.touches[0].clientX : e.clientX);
      _startSize = panel.offsetWidth;
    }
    e.preventDefault();
  }

  function _onMove(e) {
    if (!_active) return;
    var panel = _getPanel();
    if (!panel) return;
    var pos = e.touches ? e.touches[0].clientX : e.clientX;
    if (_mobile) {
      pos = e.touches ? e.touches[0].clientY : e.clientY;
      var newH = _clampMobile(_startSize - (pos - _startPos));
      panel.style.height = newH + 'px';
    } else {
      var newW = _clampDesktop(_startSize + (pos - _startPos));
      panel.style.width    = newW + 'px';
      panel.style.minWidth = newW + 'px';
    }
    requestAnimationFrame(function() {
      var m = _getMap();
      if (m) try { m.resize(); } catch(e2) {}
    });
  }

  function _onEnd(e) {
    if (!_active) return;
    _active = false;
    var panel = _getPanel();
    if (!panel) return;
    var val = _mobile ? parseInt(panel.style.height) : parseInt(panel.style.width);
    if (!isNaN(val)) {
      try { localStorage.setItem('panelWidth', String(val)); } catch(e2) {}
    }
  }

  function init() {
    var handle = document.getElementById('panel-resize-handle');
    if (!handle) return;

    handle.addEventListener('mousedown',  _onStart, { passive: false });
    handle.addEventListener('touchstart', _onStart, { passive: false });
    document.addEventListener('mousemove', _onMove);
    document.addEventListener('touchmove', _onMove, { passive: false });
    document.addEventListener('mouseup',   _onEnd);
    document.addEventListener('touchend',  _onEnd);

    /* Restaurer depuis localStorage */
    try {
      var saved = localStorage.getItem('panelWidth');
      if (saved) {
        var v = parseInt(saved, 10);
        var panel = _getPanel();
        if (!isNaN(v) && panel) {
          panel.style.width    = v + 'px';
          panel.style.minWidth = v + 'px';
        }
      }
    } catch(e3) {}
  }

  return { init: init, _onStart: _onStart, _onMove: _onMove, _onEnd: _onEnd };
})();
PanelResize.init();
</script>
